name: CI/CD & Deploy to Portainer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test Go Agent
        run: |
          cd agents/linux
          go vet ./...
          go test ./...

  publish-and-deploy:
    name: Build Docker Images & Deploy
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/wittemberg/infraops-web:latest

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/wittemberg/infraops-api:latest

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/wittemberg/infraops-worker:latest

      - name: Trigger Portainer Webhook
        run: |
          WEBHOOK_URL="${{ secrets.PORTAINER_WEBHOOK_URL }}"
          if [ -z "$WEBHOOK_URL" ]; then
            WEBHOOK_URL="https://portainer.wrtec.com.br/api/stacks/webhooks/a1ad5561-618d-42ea-a88d-68043997e963"
          fi
          echo "Triggering Portainer Stack deployment..."
          curl -X POST "$WEBHOOK_URL"
