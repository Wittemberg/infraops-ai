global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "tenant_id", "severity"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default-webhook"

receivers:
  - name: "default-webhook"
    webhook_configs:
      - url: "http://backend:3000/api/v1/alerts/webhook"
        send_resolved: true
