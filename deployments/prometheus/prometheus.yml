global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "infraops-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:3000"]

  - job_name: "infraops-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["worker:3000"]
