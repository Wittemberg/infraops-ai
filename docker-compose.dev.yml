version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: infraops-postgres-dev
    environment:
      POSTGRES_DB: infraops_db
      POSTGRES_USER: infraops_app
      POSTGRES_PASSWORD: dev_password
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: infraops-redis-dev
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-13T07-53-03Z-cpuv1
    container_name: infraops-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dev_minio_data:/data

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_minio_data:
